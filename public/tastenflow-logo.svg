<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 56 56" role="img" aria-label="Tastenflow">
  <title>Tastenflow</title>
  <desc>Eine blaue Tastatur-Taste mit abgerundeten Ecken. Oben ein großes weißes T, darunter eine flache, unregelmäßige weiße Welle.</desc>
  <!-- Tastenflow-Zeichen (30.08.2026): eine Taste, oben das T, darunter die
       flache, unregelmäßige Welle - der Fluss beim Tippen. Das T ist GEZEICHNET
       (kein <text>): Ein Favicon lädt keine Schriften nach, mit Text stünde
       hier je nach System eine andere Schrift. Geometrie angelehnt an
       Atkinson Hyperlegible Bold. Quelle mit src/components/TastenflowLogo.tsx
       identisch zu halten. Taste #0072b2 = Zeigefinger links (Okabe-Ito),
       dieselbe Farbe wie in der Bildschirm-Tastatur der App. -->
  <!-- LEICHTE PLASTIK (08.09.2026, Johannes: „versuche alle ikons leicht
       plastisch zu machen ohne sonst etwas zu verändern"). Ein Verlauf über
       der Taste, der nach unten NUR ABDUNKELT - Licht von oben, nichts an der
       Geometrie gerührt.
       ★★★ AUFGEHELLT WIRD NIE. Die Tastenfarbe ist genau so weit abgedunkelt,
       dass der weiße Glyph 4,5:1 hält (gemessen 5,02 bis 5,15:1). Ein
       Verlauf, der oben aufhellt, fällt darunter - und der Kontrast-Wächter
       sähe es nicht, weil er gegen das erste Rechteck misst. Nach unten wird
       der Kontrast dadurch besser (7,1:1 am unteren Rand). -->
  <defs>
    <linearGradient id="tastenflow-tiefe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="#0072b2"/>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#tastenflow-tiefe)"/>
  <path d="M22.5 13 H41.5 A1.2 1.2 0 0 1 42.7 14.2 V17.3 A1.2 1.2 0 0 1 41.5 18.5 H35.1 V33.8 A1.2 1.2 0 0 1 33.9 35 H30.1 A1.2 1.2 0 0 1 28.9 33.8 V18.5 H22.5 A1.2 1.2 0 0 1 21.3 17.3 V14.2 A1.2 1.2 0 0 1 22.5 13 Z" fill="#FBFBFD"/>
  <path d="M12 46.5 C 13.3 45.8, 15.2 44.8, 17 44.8 C 19.5 44.8, 21.5 47.8, 24 47.8 C 27.5 47.8, 30 43.8, 34 43.8 C 38 43.8, 40.5 47.5, 44 47.5 C 47 47.5, 50.2 46.2, 52 45.5" stroke="#FBFBFD" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
